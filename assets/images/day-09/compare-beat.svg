  <rect x="36" y="36" width="728" height="448" fill="#f3efe6"/>
  <rect x="36" y="348" width="728" height="136" fill="#e7d7b8"/>
  <rect x="36" y="348" width="728" height="8" fill="#cbb892"/>
  <g fill="none" stroke="#2c2924" stroke-width="5" stroke-linecap="round">
    <g>
      <line x1="100" y1="348" x2="100" y2="176"/>
