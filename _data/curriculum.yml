  category: 生活美学
  topic: 家居材质的搭配
  examples: "两三件 CC0 器物或纺织品照片，讲邻近的材质怎样相处。不拍私人住宅。"
  published: false
-
  day: 24
  title: "空气：颜色怎样把远处推远"
  category: 艺术史入门
  topic: 颜色与空气
  examples: "优先透纳或柯罗的 CC0 风景。若《印象·日出》一类莫奈作品的照片确为公有领域或 CC0，也可以用。讲颜色怎样把远处推远，不讲画派名单。"
  published: false
-
