-
  day: 21
  title: "对比：靠一点差别把眼睛叫醒"
  category: 基础理论
  topic: 对比
  examples: "深浅、大小、疏密三组本站简图，再配一幅对比清楚的开放许可绘画。差别只要够用，不必喊得最大声。"
  published: false
-
  day: 22
  title: "包豪斯：好用和好看是一件事"
  category: 艺术史入门
  topic: 功能与形式
  examples: "一件能合法使用图像的包豪斯设计。作者若未过版权保护期，或馆藏照片不是 CC0 / 公有领域，就改用许可清楚的例子讲同一件事（如震教家具，或十九世纪工具与建筑照片），并改写本条 examples。题目保持功能与形式。"
  published: false
-
  day: 23
