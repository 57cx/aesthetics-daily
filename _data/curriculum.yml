  category: 赏析练习
  topic: 长时间观看
  examples: "选一幅已经能合法展示、信息又不太挤的画，最好是读者还没在前面看厌的一张。五个问题都从已经学过的留白、重心、光里长出来。"
  published: false
-
  day: 12
  title: "材质：丝、纸、石头，看起来不一样"
  category: 基础理论
  topic: 材质
  examples: "对比一件绢本和一件纸本（都须开放许可），再说到器物表面。让读者看出底子本身也在说话。"
