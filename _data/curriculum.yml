  category: 基础理论
  topic: 主次
  examples: "回看马远：人很小，松很大。再配一张主次含糊的本站示意，讲大小和轻重，而不是讲谁更重要的人生道理。"
  published: false
-
  day: 19
  title: "倪瓒：疏到几乎没有东西"
  category: 艺术史入门
  topic: 疏体山水
  examples: "倪瓒一件疏朗的纸本，优先克利夫兰或大都会的 CC0 藏品。讲少到什么程度仍然站得住，接上第一日的留白。"
  published: false
